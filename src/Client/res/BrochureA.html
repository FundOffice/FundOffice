<style>
.gold-leaf{--red:#b72f2b;--deep:#6f1515;--gold:#f4c46a;--paper:#fff8ea;--ink:#2a1d17;--muted:#7b665c;font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;background:#edd9b0;color:var(--ink);font-size:13px;line-height:1.55;overflow:hidden}
.mode-original .gold-leaf{width:980px;max-width:100%;margin:0 auto;box-shadow:0 16px 46px rgba(111,21,21,.22)}.mode-a4 .gold-leaf{width:210mm;min-height:297mm}.mode-a4 .gl-page{min-height:297mm}.mode-wide .gold-leaf{width:100%;min-height:297mm}.mode-wide .gl-page{max-width:980px;margin:0 auto}
.gl-page{min-height:1180px;background:linear-gradient(180deg,#fff5df,#ffffff 42%,#fff9ed);position:relative;overflow:hidden}.gl-hero{position:relative;padding:42px 48px 220px;background:linear-gradient(140deg,var(--deep),var(--red));color:#fff;overflow:hidden}.gl-hero::before{content:"";position:absolute;right:-90px;top:-90px;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,#f7d488 0 18%,rgba(247,212,136,.18) 18% 48%,transparent 49%)}.gl-hero::after{content:"";position:absolute;left:-80px;right:-80px;bottom:-135px;height:250px;background:#fff;border-radius:50% 50% 0 0/80% 80% 0 0}
.gl-brand{position:relative;z-index:1;display:flex;align-items:center;gap:13px;margin-bottom:54px}.gl-logo{width:54px;height:54px;object-fit:contain;padding:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.26)}.gl-manager{font-size:18px;font-weight:900}.gl-meta{font-size:11px;color:rgba(255,255,255,.7);margin-top:3px}
.gl-slogan{position:relative;z-index:1;display:inline-block;background:var(--gold);color:#5b180f;padding:7px 14px;font-weight:900;margin-bottom:18px}.gl-title{position:relative;z-index:1;font-size:50px;line-height:1.04;font-weight:900;text-shadow:0 8px 18px rgba(0,0,0,.2)}.gl-sub{position:relative;z-index:1;margin-top:15px;max-width:680px;font-size:17px;color:#ffe9b7}.gl-coins{position:absolute;right:86px;bottom:42px;z-index:2;width:210px;height:120px}.gl-coins i{position:absolute;bottom:0;width:46px;background:linear-gradient(180deg,#ffe29a,#c98224);border-radius:12px 12px 4px 4px;box-shadow:0 12px 24px rgba(0,0,0,.16)}.gl-coins i:nth-child(1){left:0;height:58px}.gl-coins i:nth-child(2){left:48px;height:82px}.gl-coins i:nth-child(3){left:96px;height:108px}.gl-coins i:nth-child(4){left:144px;height:72px}.gl-coins::after{content:"";position:absolute;right:-10px;top:8px;width:86px;height:86px;border-right:16px solid var(--gold);border-top:16px solid var(--gold);transform:rotate(35deg)}
.gl-main{position:relative;z-index:3;margin:-132px 42px 0;display:grid;gap:20px}.gl-info{background:#fff;border:1px solid #efd8a5;box-shadow:0 16px 34px rgba(111,21,21,.14)}.gl-tab{display:inline-block;transform:translateY(-50%);margin-left:24px;background:var(--red);color:#fff;padding:8px 22px;font-size:16px;font-weight:900}.gl-info-body{padding:0 22px 22px}.gl-product{font-size:21px;font-weight:900;color:var(--deep);margin-bottom:12px;line-height:1.28}.gl-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.gl-cell{background:#fff7e8;border:1px solid #efd8a5;padding:9px 11px;min-height:58px}.gl-cell span{display:block;color:var(--muted);font-size:11px}.gl-cell b{display:block;margin-top:4px;color:var(--deep);font-size:14px;line-height:1.25;word-break:break-word}
.gl-row{display:grid;grid-template-columns:1fr;gap:28px}.gl-row:first-of-type{margin-top:14px}.gl-section{background:#fff;border:1px solid #efd8a5;box-shadow:0 16px 34px rgba(111,21,21,.14);padding:4px 12px 14px;break-inside:avoid;page-break-inside:avoid}.gl-section h2{display:inline-block;transform:translateY(-58%);margin:0 0 4px 2px;background:var(--red);color:#fff;padding:8px 22px;font-size:16px;font-weight:900}.gl-section h2::before{content:none}.gl-copy{white-space:pre-wrap;word-break:break-word;color:#4b3830}.gl-points{display:grid;gap:12px}.gl-point{display:grid;grid-template-columns:34px 1fr;gap:10px}.gl-point i{font-style:normal;width:34px;height:34px;display:grid;place-items:center;background:var(--red);color:#fff;font-weight:900}.gl-point b{display:block;color:var(--deep);margin-bottom:3px}.gl-point span{color:#5f514b;word-break:break-word}
.gl-people{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gl-person{display:flex;gap:12px;padding:12px;background:#fff7e8;border:1px solid #efd8a5}.gl-photo{width:68px;height:84px;object-fit:cover;background:#eadfd1;flex:0 0 68px}.gl-name{font-size:16px;font-weight:900;color:var(--deep);margin-bottom:7px}.gl-profile{font-size:12px;color:#6b5b54;white-space:pre-wrap;word-break:break-word}.gl-lines{display:grid;gap:10px;margin:0}.gl-fee-lines,.gl-service-lines{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:0}.gl-share-lines{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin:0}.gl-line{background:#fff7e8;border-left:4px solid var(--gold);padding:11px 13px;word-break:break-word}.gl-line b{display:block;color:var(--deep);margin-bottom:4px}.gl-tag-list{display:flex;flex-wrap:wrap;gap:8px}.gl-tag-item{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;background:#fff;border:1px solid #efd8a5}.gl-tag-item i{font-style:normal;padding:2px 6px;background:var(--deep);color:#fff;font-size:12px;font-weight:900}.gl-risk{margin:24px 42px 34px;padding:15px 18px;background:#fff7e8;border:1px solid #efd8a5;color:#744210;font-size:12px;break-inside:avoid;page-break-inside:avoid}.gl-risk-title{font-weight:900;color:#975a16;margin-bottom:8px}.gl-risk ol{margin:0;padding-left:20px}.gl-risk li{margin:3px 0;line-height:1.7}
</style>
<div class="gold-leaf" id="glRoot"><div class="gl-page">
  <section class="gl-hero"><div class="gl-brand"><img class="gl-logo" id="glLogo" style="display:none" alt="Logo"><div><div class="gl-manager" id="glManager"></div><div class="gl-meta" id="glMeta"></div></div></div><div class="gl-slogan">私募基金产品资料</div><div class="gl-title" id="glTitle"></div><div class="gl-sub" id="glSub"></div><div class="gl-coins"><i></i><i></i><i></i><i></i></div></section>
  <main class="gl-main"><section class="gl-info"><div class="gl-tab">产品档案</div><div class="gl-info-body"><div class="gl-product" id="glProduct"></div><div class="gl-grid" id="glGrid"></div></div></section><div class="gl-row" id="glRow1"></div><div class="gl-row" id="glRow2"></div></main>
  <div class="gl-risk"><div class="gl-risk-title">风险提示与免责声明</div><ol><li>本宣传资料仅为产品信息展示，不构成任何投资邀约、推介或交易要约；</li><li>私募基金存在市场风险、流动性风险、信用风险等多重风险，过往业绩不代表未来收益；</li><li>投资者应当具备相应风险识别能力和风险承担能力，自行审慎评估自身财务状况与风险承受能力；</li><li>请仔细阅读基金合同、风险揭示书、投资者适当性匹配文件等全部法律文件，独立做出投资决策；</li><li>管理人、托管人及外包机构不对投资本金及收益作出任何保本、保收益承诺；</li><li>本资料内容仅供内部参考，不得作为公开募集、对外推销使用，复制传播前须经管理人书面许可。</li></ol></div>
</div></div>
<script>
(function(){var d=window.broData||{},root=document.getElementById('glRoot');if(!root||!window.broData){root.innerHTML='<div style="padding:40px;color:#b42318">暂无数据</div>';return}
function ok(v){if(v==null)return false;if(typeof v==='string'){var s=v.trim();return s&&s!=='未设置'}if(Array.isArray(v))return v.some(ok);return true}function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(m){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]})}function br(v){return ok(v)?esc(v).replace(/\n/g,'<br>'):''}function arr(a){return Array.isArray(a)?a.filter(ok):[]}function first(a){return arr(a)[0]||''}function img(x){if(!x)return'';if(typeof x==='string')return x.indexOf('data:')===0?x:'data:image/png;base64,'+x;try{var b=new Uint8Array(x),s='';for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);return'data:image/png;base64,'+btoa(s)}catch(e){return''}}
function cell(k,v){return ok(v)?'<div class="gl-cell"><span>'+esc(k)+'</span><b>'+br(v)+'</b></div>':''}function sec(t,c){return c?'<section class="gl-section"><h2>'+esc(t)+'</h2>'+c+'</section>':''}function line(k,v){return'<div class="gl-line"><b>'+esc(k)+'</b>'+(ok(v)?br(v):'待补充')+'</div>'}function tagLine(k,a){var values=arr(a);if(!values.length)return line(k,'待补充');if(values.length===1)return line(k,values[0]);var sc=Array.isArray(d.ShareClasses)?d.ShareClasses.filter(function(x){return x&&ok(x.Name)}):[];return '<div class="gl-line"><b>'+esc(k)+'</b><div class="gl-tag-list">'+values.map(function(v,i){var name=sc[i]&&ok(sc[i].Name)?sc[i].Name:('类别'+(i+1));return '<span class="gl-tag-item"><i>'+esc(name)+'</i>'+br(v)+'</span>'}).join('')+'</div></div>'}function joinArr(a){return arr(a).join('；')}
var logo=img(d.ManagerLogo);if(logo){glLogo.src=logo;glLogo.style.display='block'}glManager.textContent=ok(d.ManagerName)?d.ManagerName:'基金管理人';glMeta.textContent=[ok(d.ManagerAmacCode)?'登记编号 '+d.ManagerAmacCode:'',ok(d.Code)?'产品编码 '+d.Code:''].filter(Boolean).join(' / ');
glTitle.textContent=ok(d.ShortName)?d.ShortName:'基金产品';glSub.innerHTML=ok(d.FundName)?br(d.FundName):'私募基金产品资料';glProduct.textContent=ok(d.FundName)?d.FundName:'基金产品资料';
glGrid.innerHTML=cell('产品代码',d.Code)+cell('风险等级',d.RiskLevel)+cell('产品类型',d.Type)+cell('运作方式',d.FundModeInfo)+cell('成立日期',d.SetupDate)+cell('开放安排',first(d.OpenInfo));
var scope='<div class="gl-lines">'+line('投资范围',d.InvestmentScope)+line('投资策略',d.InvestmentStrategy)+'</div>';
var shareClasses=Array.isArray(d.ShareClasses)?d.ShareClasses.filter(function(s){return s&&ok(s.Name)}):[];var shares='<div class="gl-share-lines">'+(shareClasses.length?shareClasses.map(function(s){return line(s.Name,s.Requirement)}).join(''):line('份额类型','待补充'))+'</div>';
var trade='<div class="gl-lines">'+tagLine('开放日',d.OpenInfo)+tagLine('认购规则',d.SubscriptionRule)+tagLine('申购规则',d.PurchasRule)+tagLine('赎回费用',d.RedemptionFee)+line('冷静期',d.CoolingPeriod)+'</div>';
var fee='<div class="gl-fee-lines">'+tagLine('管理费',d.ManageFee)+tagLine('业绩报酬',d.PerformanceFeeStatement)+line('托管费',d.TrusteeFee)+line('外包费',d.OutsourcingFee)+'</div>';
var service='<div class="gl-service-lines">'+line('托管机构',d.TrusteeInfo)+line('外包机构',d.OutsourcingInfo)+'</div>';
var mgr='<div class="gl-people">'+(Array.isArray(d.InvestmentManagers)?d.InvestmentManagers:[]).filter(function(m){return m&&(ok(m.Name)||ok(m.Profile))}).map(function(m){var p=img(m.Photo);return '<div class="gl-person">'+(p?'<img class="gl-photo" src="'+p+'" alt="'+esc(m.Name||'投资经理')+'">':'')+'<div><div class="gl-name">'+esc(m.Name||'投资经理')+'</div><div class="gl-profile">'+br(m.Profile)+'</div></div></div>'}).join('')+'</div>';
glRow1.innerHTML=sec('投资范围与策略',scope)+sec('投资经理',mgr);glRow2.innerHTML=sec('份额类型',shares)+sec('申赎规则',trade)+sec('费用信息',fee)+sec('服务机构',service);
})();
</script>
