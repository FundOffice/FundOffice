name: 发布Thor
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
      packages: read

    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with: 
          fetch-depth: 0  

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
          source-url: https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 初始化强签名密钥
        shell: pwsh
        run: |
          $b64 = "${{ secrets.FOSNK }}" -replace '\s', ''
          $bytes = [Convert]::FromBase64String($b64)
          $keyPath = Join-Path $env:RUNNER_TEMP "fo.snk"
          [IO.File]::WriteAllBytes($keyPath, $bytes)
          Add-Content $env:GITHUB_ENV "STRONG_KEY_PATH=$keyPath"

      - name: 执行发布逻辑
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = (Get-Location).Path
          Set-Location $scriptPath
            
          $publishDir = Join-Path $scriptPath "Thor"
          $appDir = Join-Path $publishDir "app"
          $languageFolders = @( "cs", "de", "es", "fr", "it", "ja", "ko", "pl", "pt-BR", "ru", "tr", "zh-Hans", "zh-Hant", "playwright" )
          $foldersToKeep = @( "app", ".ck", "esign", "mission", "runtimes", "trigger", "trustee" )

          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "开始发布 FundOffice 项目" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          # 提取版本
          $buildVersion = if ("${{ github.ref }}" -like "refs/tags/v*") {
                   "${{ github.ref_name }}" -replace '^v', ''
              } else {
                   "1.1.2.0" 
              }

          # 准备发布目录
          if (Test-Path $publishDir) {
              Write-Host "清理现有发布目录..." -ForegroundColor Yellow
              $allItems = Get-ChildItem -Path $publishDir -Force
              foreach ($item in $allItems) {
                  if ($foldersToKeep -notcontains $item.Name) {
                      Remove-Item $item.FullName -Recurse -Force
                      Write-Host "  已删除: $($item.Name)" -ForegroundColor Gray
                  } else {
                      Write-Host "  保留: $($item.Name)" -ForegroundColor Cyan
                  }
              }
          } else {
              New-Item -ItemType Directory -Path $publishDir -Force | Out-Null
          }
          Write-Host "发布目录已准备: $publishDir" -ForegroundColor Green
          Write-Host ""

          # [0] NuGet Restore
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "[0/4] 执行 NuGet Restore" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          $slnFile = Join-Path $scriptPath "FundOffice.slnx"
          if (Test-Path $slnFile) {
              dotnet restore $slnFile /p:Configuration=Release
              if ($LASTEXITCODE -eq 0) { Write-Host "✓ 解决方案还原成功" -ForegroundColor Green }
              else { Write-Host "✗ 解决方案还原失败" -ForegroundColor Red; exit 1 }
          } else {
              Write-Host "⚠ 未找到解决方案文件: $slnFile" -ForegroundColor Yellow
          }

          # 还原 Tools 项目（不在解决方案中）
          $toolsRestorePath = Join-Path $scriptPath "src\Tools"
          if (Test-Path $toolsRestorePath) {
              $toolsCsprojs = Get-ChildItem -Path $toolsRestorePath -Include "*.csproj" -Recurse -File | Where-Object { $_.BaseName -notlike "*tmp*" }
              foreach ($proj in $toolsCsprojs) {
                  Write-Host "还原 Tools: $($proj.BaseName)" -ForegroundColor Yellow
                  dotnet restore $proj.FullName /p:Configuration=Release
                  if ($LASTEXITCODE -eq 0) { Write-Host "  ✓ 成功" -ForegroundColor Green } else { Write-Host "  ✗ 失败" -ForegroundColor Red }
              }
          }
          Write-Host ""

          # [1] 发布核心项目及 src 模块
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "[1/4] 发布核心项目及 src 模块" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          $publishedProjects = @()

          # 1.1 先发布 src\Client\FundOffice.csproj
          $clientProject = Join-Path $scriptPath "src\Client\FundOffice.csproj"
          if (Test-Path $clientProject) {
              Write-Host "发布核心项目: src\Client\FundOffice.csproj" -ForegroundColor Yellow
              dotnet publish $clientProject --configuration Release --output $appDir --no-restore /p:DebugType=None /p:DebugSymbols=false /p:Version=$buildVersion
              if ($LASTEXITCODE -eq 0) { 
                  Write-Host "✓ 核心项目发布成功" -ForegroundColor Green 
                  $publishedProjects += $clientProject
              } else { 
                  Write-Host "✗ 核心项目发布失败" -ForegroundColor Red; exit 1 
              }
          } else { 
              Write-Host "✗ 未找到核心项目文件: $clientProject" -ForegroundColor Red; exit 1 
          }
          Write-Host ""

          # 1.2 找 src 下有 Directory.Build.props 的目录，再按它发布
          $srcPath = Join-Path $scriptPath "src"
          if (Test-Path $srcPath) {
              $srcPathNormalized = (Get-Item $srcPath).FullName 
              
              $buildPropsFiles = Get-ChildItem -Path $srcPath -Filter "Directory.Build.props" -Recurse -File | 
                                 Where-Object { $_.DirectoryName -ne $srcPathNormalized }
              
              if ($buildPropsFiles.Count -gt 0) {
                  Write-Host "找到 $($buildPropsFiles.Count) 个子模块目录（已排除 src 根目录）" -ForegroundColor Green
                  
                  $moduleProjects = @()
                  foreach ($propsFile in $buildPropsFiles) {
                      $moduleDir = $propsFile.DirectoryName
                      $projects = Get-ChildItem -Path $moduleDir -Include "*.csproj", "*.vbproj" -Recurse -File | 
                                  Where-Object { 
                                      $_.FullName -notin $publishedProjects -and 
                                      $_.BaseName -notlike "*tmp*" -and 
                                      $_.BaseName -ne "Launcher" 
                                  }
                      $moduleProjects += $projects
                  }
                  
                  $moduleProjects = $moduleProjects | Sort-Object FullName -Unique
                  
                  if ($moduleProjects.Count -eq 0) {
                      Write-Host "⚠ 子模块目录下未找到其他需要发布的项目" -ForegroundColor Yellow
                  } else {
                      Write-Host "准备发布子模块目录下的 $($moduleProjects.Count) 个项目" -ForegroundColor Yellow

                      # 清理所有子模块项目的 obj 目录，避免 Debug/Release 生成文件交叉冲突（CS0579）
                      $cleanedObj = 0
                      foreach ($project in $moduleProjects) {
                          $objDir = Join-Path $project.DirectoryName "obj"
                          if (Test-Path $objDir) {
                              Remove-Item $objDir -Recurse -Force -ErrorAction SilentlyContinue
                              $cleanedObj++
                          }
                      }
                      if ($cleanedObj -gt 0) { Write-Host "✓ 已清理 $cleanedObj 个项目的 obj 目录" -ForegroundColor Green }

                      $idx = 1
                      foreach ($project in $moduleProjects) {
                          $relativePath = $project.FullName.Substring($scriptPath.Length).TrimStart('\', '/')
                          Write-Host "[$idx/$($moduleProjects.Count)] 发布: $relativePath" -ForegroundColor Yellow
                          
                          dotnet publish $project.FullName --configuration Release --output $appDir /p:DebugType=None /p:DebugSymbols=false /p:OutputPath=$appDir /p:BaseOutputPath=$appDir /p:Version=$buildVersion
                          if ($LASTEXITCODE -eq 0) { 
                              Write-Host "  ✓ 成功" -ForegroundColor Green 
                              $publishedProjects += $project.FullName
                          } else { 
                              Write-Host "  ✗ 失败" -ForegroundColor Red 
                          }
                          $idx++
                          Write-Host ""
                      }
                  }
              } else {
                  Write-Host "⚠ 未在 src 的子目录中找到 Directory.Build.props 文件" -ForegroundColor Yellow
              }
          } else {
              Write-Host "⚠ 未找到 src 目录" -ForegroundColor Yellow
          }
          Write-Host ""

          # [2] 发布 src\Tools 下的所有项目（Launcher 在步骤 2b 单独处理）
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "[2/4] 发布 src\Tools 下的所有项目" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          $toolsPath = Join-Path $scriptPath "src\Tools"
          if (Test-Path $toolsPath) {
              $allToolsProjects = Get-ChildItem -Path $toolsPath -Include "*.csproj", "*.vbproj" -Recurse -File
              $toolsProjectFiles = $allToolsProjects | Where-Object { $_.BaseName -notlike "*tmp*" -and $_.BaseName -notlike "*Test*" -and $_.BaseName -ne "Launcher" }
              $toolsExcludedProjects = $allToolsProjects | Where-Object { $_.BaseName -like "*tmp*" -or $_.BaseName -like "*Test*" }

              if ($toolsExcludedProjects.Count -gt 0) {
                  Write-Host "已跳过以下 Tools 项目: " -ForegroundColor Yellow
                  $toolsExcludedProjects | ForEach-Object { Write-Host "  - $($_.BaseName) " -ForegroundColor Gray }
                  Write-Host ""
              }

              if ($toolsProjectFiles.Count -eq 0) { 
                  Write-Host "⚠ 未找到任何可发布的 Tools 项目文件" -ForegroundColor Yellow 
              } else {
                  # 清理 WPF Tools 项目的 obj 目录，避免 Debug/Release 生成文件交叉冲突（CS0579）
                  foreach ($project in $toolsProjectFiles) {
                      $objDir = Join-Path $project.DirectoryName "obj"
                      if (Test-Path $objDir) {
                          Remove-Item $objDir -Recurse -Force -ErrorAction SilentlyContinue
                          Write-Host "  已清理 $($project.BaseName)\obj" -ForegroundColor Gray
                      }
                  }
                  Write-Host "✓ obj 目录清理完成" -ForegroundColor Green
                  Write-Host ""

                  Write-Host "找到 $($toolsProjectFiles.Count) 个 Tools 项目（已排除 tmp/Test/Launcher）" -ForegroundColor Green
                  $idx = 1
                  foreach ($project in $toolsProjectFiles) {
                      Write-Host "[$idx/$($toolsProjectFiles.Count)] 发布: $($project.BaseName)" -ForegroundColor Yellow
                      dotnet publish $project.FullName --configuration Release --output $appDir /p:DebugType=None /p:DebugSymbols=false /p:OutputPath=$appDir /p:BaseOutputPath=$appDir /p:Version=$buildVersion
                      if ($LASTEXITCODE -eq 0) { Write-Host "  ✓ 成功" -ForegroundColor Green } else { Write-Host "  ✗ 失败" -ForegroundColor Red }
                      $idx++
                      Write-Host ""
                  }
              }
          } else { Write-Host "⚠ 未找到 src\Tools 目录" -ForegroundColor Yellow }

          # [2b] 发布 Launcher（AOT，需指定运行时）
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "[2b] 发布 Launcher (AOT, win-x64)" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          $launcherProject = Join-Path $scriptPath "src\Tools\Launcher\Launcher.csproj"
          $launcherTempDir = Join-Path $scriptPath "publish_temp_launcher"
          if (Test-Path $launcherProject) {
              Write-Host "发布 AOT 项目: Launcher (到临时目录)" -ForegroundColor Yellow
              if (Test-Path $launcherTempDir) { Remove-Item $launcherTempDir -Recurse -Force }
              dotnet publish $launcherProject --configuration Release --runtime win-x64 --self-contained --output $launcherTempDir /p:DebugType=None /p:DebugSymbols=false
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "  ✓ Launcher 发布成功" -ForegroundColor Green
                  $launcherExe = Join-Path $launcherTempDir "Launcher.exe"
                  if (Test-Path $launcherExe) {
                      Copy-Item $launcherExe $publishDir -Force
                      Write-Host "  ✓ 已复制 Launcher.exe 到根目录" -ForegroundColor Green
                  }
                  $proxiesTxt = Join-Path $launcherTempDir "proxies.txt"
                  if (Test-Path $proxiesTxt) {
                      Copy-Item $proxiesTxt $publishDir -Force
                      Write-Host "  ✓ 已复制 proxies.txt 到根目录" -ForegroundColor Green
                  }
                  Remove-Item $launcherTempDir -Recurse -Force -ErrorAction SilentlyContinue
              } else { 
                  Write-Host "  ✗ Launcher 发布失败" -ForegroundColor Red 
              }
          } else { Write-Host "⚠ 未找到 Launcher 项目: $launcherProject" -ForegroundColor Yellow }
          Write-Host "  ✓ 根目录仅保留 Launcher.exe + proxies.txt（自包含运行时已丢弃）" -ForegroundColor Green
          Write-Host ""

          # [3] 清理语言文件夹、pdb、node.exe 和非 x64 运行时
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "[3/4] 清理语言文件夹、pdb、node.exe 和非 x64 运行时" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          $deletedLang = 0
          foreach ($lang in $languageFolders) {
              $p = Join-Path $appDir $lang
              if (Test-Path $p) { Remove-Item $p -Recurse -Force; $deletedLang++ }
          }
          if ($deletedLang -gt 0) { Write-Host "✓ 已删除 $deletedLang 个语言文件夹" -ForegroundColor Green }
          else { Write-Host "  无语言文件夹需要删除" -ForegroundColor Gray }

          # 删除 modelfiles 文件夹
          $modelFilesDir = Join-Path $appDir "modelfiles"
          if (Test-Path $modelFilesDir) {
              Remove-Item $modelFilesDir -Recurse -Force
              Write-Host "✓ 已删除 modelfiles 目录" -ForegroundColor Green
          } else { Write-Host "  无 modelfiles 目录" -ForegroundColor Gray }

          $pdbFiles = Get-ChildItem -Path $appDir -Filter "*.pdb" -Recurse -File
          if ($pdbFiles.Count -gt 0) {
              $pdbFiles | Remove-Item -Force
              Write-Host "✓ 已删除 $($pdbFiles.Count) 个 pdb 文件" -ForegroundColor Green
          } else { Write-Host "  无 pdb 文件" -ForegroundColor Gray }

          # 删除 Playwright 捆绑的 node.exe（约 87 MB）
          $nodeExeDir = Join-Path $appDir ".playwright\node"
          if (Test-Path $nodeExeDir) {
              Remove-Item $nodeExeDir -Recurse -Force
              Write-Host "✓ 已删除 .playwright\node 目录（含 node.exe）" -ForegroundColor Green
          } else { Write-Host "  无 .playwright\node 目录" -ForegroundColor Gray }

          # runtimes 仅保留 win-x64
          $runtimesDir = Join-Path $appDir "runtimes"
          if (Test-Path $runtimesDir) {
              $nonX64 = Get-ChildItem $runtimesDir -Directory | Where-Object { $_.Name -ne "win-x64" }
              if ($nonX64.Count -gt 0) {
                  $nonX64 | Remove-Item -Recurse -Force
                  Write-Host "✓ 已删除 $($nonX64.Count) 个非 x64 运行时目录" -ForegroundColor Green
              } else { Write-Host "  runtimes 仅含 win-x64，无需清理" -ForegroundColor Gray }
          }
          Write-Host ""

          # [4] 安全清理未引用的项目级 DLL
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "[4/4] 清理未被 EXE 引用的项目 DLL（保留系统/第三方库）" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          $projectNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          $searchDirs = @($scriptPath, $toolsPath)
          foreach ($dir in $searchDirs) {
              if (Test-Path $dir) {
                  Get-ChildItem -Path $dir -Include "*.csproj", "*.vbproj" -Recurse -File | 
                      Where-Object { $_.BaseName -notlike "*tmp*" -and $_.BaseName -notlike "*Test*" } | 
                      ForEach-Object { $null = $projectNames.Add($_.BaseName) }
              }
          }

          $exes = Get-ChildItem -Path $appDir -Filter "*.exe" -File
          $referencedDlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          if ($exes.Count -gt 0) {
              Write-Host "正在分析 EXE 依赖关系..." -ForegroundColor Yellow
              foreach ($exe in $exes) {
                  $depsFile = Join-Path $appDir "$($exe.BaseName).deps.json"
                  if (Test-Path $depsFile) {
                      try {
                          $json = Get-Content $depsFile -Raw | ConvertFrom-Json
                          if ($json.libraries) {
                              foreach ($lib in $json.libraries.PSObject.Properties.Name) {
                                  $null = $referencedDlls.Add(($lib -split '/')[0])
                              }
                          }
                      } catch {}
                  }
              }
          }

          $allDlls = Get-ChildItem -Path $appDir -Filter "*.dll" -File
          $candidateDlls = $allDlls | Where-Object { $projectNames.Contains($_.BaseName) }

          if ($candidateDlls.Count -eq 0) {
              Write-Host "  未发现项目级 DLL，跳过清理" -ForegroundColor Gray
          } else {
              $unusedDlls = $candidateDlls | Where-Object { -not $referencedDlls.Contains($_.BaseName) }
              $delCount = 0
              foreach ($dll in $unusedDlls) {
                  $base = $dll.BaseName
                  Write-Host "  删除未引用项目 DLL: $($dll.Name)" -ForegroundColor Yellow
                  Remove-Item $dll.FullName -Force -ErrorAction SilentlyContinue
                  @(".xml", ".config") | ForEach-Object {
                      $path = Join-Path $appDir "$base$_"
                      if (Test-Path $path) { Remove-Item $path -Force -ErrorAction SilentlyContinue }
                  }
                  $delCount++
              }
              if ($delCount -eq 0) { Write-Host "  ✓ 所有项目 DLL 均已被引用，无需清理" -ForegroundColor Green }
              else { Write-Host "  ✓ 安全清理 $delCount 个未引用的项目 DLL 及附属文件" -ForegroundColor Green }
              Write-Host "  (系统库与第三方库已自动保留)" -ForegroundColor Gray
          }
          Write-Host ""

          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "发布完成!" -ForegroundColor Green
          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "发布目录: $publishDir" -ForegroundColor White

      - name: 签名指定文件夹 DLL（防篡改）
        if: success()
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $publishDir = "./Thor"
          $appDir = Join-Path $publishDir "app"
          $targetFolders = @("esign", "mission", "trigger", "trustee")
          $ckOutputDir = Join-Path $publishDir ".ck"

          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
              Write-Error "❌ 缺少签名证书 Secret (CERT_PFX_BASE64)，终止流程。"
              exit 1
          }

          Write-Host "🔐 正在加载签名证书..." -ForegroundColor Cyan
    
          $cleanBase64 = $env:CERT_PFX_BASE64 -replace '[\s"\'']', ''
          try { $certBytes = [System.Convert]::FromBase64String($cleanBase64) } catch {
              Write-Error "❌ Base64 解码失败。请检查 Secret 是否被截断。"; exit 1
          }

          try {
              $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable -bor
                        [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::UserKeySet -bor
                        [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor
                        [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::MachineKeySet

              $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certBytes, $env:CERT_PASSWORD, $flags)
          } catch {
              Write-Error "❌ PFX 加载失败：$_"; exit 1
          }

          if (-not $cert.HasPrivateKey) {
              Write-Error "❌ 致命错误：PFX 证书未加载出私钥！请检查密码或证书是否损坏。"; exit 1
          }
          Write-Host "✅ 证书加载成功，包含私钥" -ForegroundColor Green

          try {
              $privateKey = $cert.PrivateKey

              if ($privateKey -is [System.Security.Cryptography.RSA]) {
                  $rsa = $privateKey
                  Write-Host "✅ 方案 A: 直接使用证书内置 RSA 私钥" -ForegroundColor Green
              }
              elseif ($cert.GetType().GetMethod("ExportPkcs8PrivateKey")) {
                  $pkcs8Bytes = $cert.ExportPkcs8PrivateKey()
                  $rsa = [System.Security.Cryptography.RSA]::Create()
                  $null = $rsa.ImportPkcs8PrivateKey($pkcs8Bytes, [ref]$null)
                  Write-Host "✅ 方案 B: 通过 ExportPkcs8PrivateKey 提取私钥" -ForegroundColor Green
              }
              else {
                  $cspBlob = $privateKey.ExportCspBlob($true)
                  $rsa = [System.Security.Cryptography.RSACryptoServiceProvider]::new()
                  $rsa.ImportCspBlob($cspBlob)
                  Write-Host "✅ 方案 C: 通过 ExportCspBlob 提取私钥（兼容旧版）" -ForegroundColor Green
              }
          } catch {
              Write-Error "⛔ 私钥提取失败：$_"; exit 1
          }

          $signCount = 0
          foreach ($folder in $targetFolders) {
              $folderPath = Join-Path $appDir $folder
              if (Test-Path $folderPath) {
                  Write-Host "📂 正在扫描并签名: $folderPath" -ForegroundColor Cyan
                  $dlls = Get-ChildItem -Path $folderPath -Filter "*.dll" -File -Recurse
                  foreach ($dll in $dlls) {
                      try {
                          $relativePath = [System.IO.Path]::GetRelativePath($publishDir, $dll.FullName)
                          $ckTargetPath = Join-Path $ckOutputDir "$relativePath.ck"
                          $ckTargetDir = Split-Path $ckTargetPath -Parent
                          if (-not (Test-Path $ckTargetDir)) {
                              New-Item -Path $ckTargetDir -ItemType Directory -Force | Out-Null
                          }

                          $data = [System.IO.File]::ReadAllBytes($dll.FullName)
                          $sig = $rsa.SignData($data, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
                          [System.IO.File]::WriteAllBytes($ckTargetPath, $sig)
                          $signCount++
                      } catch {
                          Write-Host "  ⚠️ 签名失败: $($dll.Name) - $_" -ForegroundColor Yellow
                      }
                  }
              } else {
                  Write-Host "⚠️ 文件夹不存在，跳过: $folderPath" -ForegroundColor Yellow
              }
          }
          Write-Host "`n✅ 签名完成！共处理 $signCount 个 DLL，.ck 文件已输出至：$ckOutputDir" -ForegroundColor Green

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FundOffice-Win-x64
          path: ./Thor/

      - name: 打包 ZIP
        run: Compress-Archive -Path ./Thor/* -DestinationPath ./FundOffice-Win-x64.zip -Force
        shell: powershell

      - name: 打包 Trustee 文件夹 ZIP
        run: Compress-Archive -Path ./Thor/app/trustee/* -DestinationPath ./FundOffice-Trustee-Win-x64.zip -Force
        shell: powershell

      - name: 确定版本号
        id: version
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
              $version = "${{ github.ref_name }}"; $tag = "${{ github.ref_name }}"; $isTag = "true"
          } else {
              $version = "dev-build-$(Get-Date -Format 'yyyyMMddHHmm')"; $tag = "dev"; $isTag = "false"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "ISTAG=$isTag" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: 创建增量更新包 (Delta)
        id: delta
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $publishDir = "./Thor"
          $appDir = Join-Path $publishDir "app"
          $deltaDir = "./publish-delta"
          $currentTag = "${{ steps.version.outputs.TAG }}"
      
          $tags = git tag --sort=-version:refname | Where-Object { $_ -like "v*" -and $_ -ne $currentTag }
          if ($tags.Count -eq 0) {
              Write-Host "⚠️ 首个版本发布，跳过增量包生成" -ForegroundColor Yellow
              echo "HAS_DELTA=false" >> $env:GITHUB_ENV
              exit 0
          }
          $prevTag = $tags[0]
          Write-Host "🔄 生成增量包: $prevTag → $currentTag" -ForegroundColor Cyan
      
          $repo = "${{ github.repository }}"
          $releaseUrl = "https://api.github.com/repos/$repo/releases/tags/$prevTag"
          $release = Invoke-RestMethod -Uri $releaseUrl -Headers @{ "Authorization" = "token $env:GITHUB_TOKEN" }
      
          $asset = $release.assets | Where-Object { 
              $_.name -like "*Win-x64.zip" -and $_.name -notlike "*Trustee*" 
          } | Select-Object -First 1
      
          if (-not $asset) {
              Write-Host "⚠️ 未找到上一个版本的发布包，跳过增量包" -ForegroundColor Yellow
              echo "HAS_DELTA=false" >> $env:GITHUB_ENV
              exit 0
          }
          
          $prevDir = "./.prev-release"
          $prevAppDir = Join-Path $prevDir "app"
          $zipPath = "./.prev-release.zip"
          Invoke-WebRequest -Uri $asset.browser_download_url -Headers @{"Authorization" = "token $env:GITHUB_TOKEN"} -OutFile $zipPath
          if (Test-Path $prevDir) { Remove-Item $prevDir -Recurse -Force }
          Expand-Archive -Path $zipPath -DestinationPath $prevDir -Force
          Remove-Item $zipPath -Force
          
          if (Test-Path $deltaDir) { Remove-Item $deltaDir -Recurse -Force }
          New-Item -ItemType Directory -Path $deltaDir -Force | Out-Null
          
          $stats = @{Changed=0; Added=0; Deleted=0}
          
          Get-ChildItem -Path $appDir -File -Recurse | ForEach-Object {
              $relPath = [System.IO.Path]::GetRelativePath($appDir, $_.FullName)
              $prevPath = Join-Path $prevAppDir $relPath
              $deltaPath = Join-Path $deltaDir $relPath
              
              if (Test-Path $prevPath) {
                  $currHash = Get-FileHash $_.FullName -Algorithm SHA256
                  $prevHash = Get-FileHash $prevPath -Algorithm SHA256
                  if ($currHash.Hash -ne $prevHash.Hash) {
                      $deltaDirPath = Split-Path $deltaPath -Parent
                      if (-not (Test-Path $deltaDirPath)) { New-Item -ItemType Directory -Path $deltaDirPath -Force | Out-Null }
                      Copy-Item $_.FullName $deltaPath -Force
                      $stats.Changed++
                  }
              } else {
                  $deltaDirPath = Split-Path $deltaPath -Parent
                  if (-not (Test-Path $deltaDirPath)) { New-Item -ItemType Directory -Path $deltaDirPath -Force | Out-Null }
                  Copy-Item $_.FullName $deltaPath -Force
                  $stats.Added++
              }
          }
          
          Get-ChildItem -Path $prevAppDir -File -Recurse | ForEach-Object {
              $relPath = [System.IO.Path]::GetRelativePath($prevAppDir, $_.FullName)
              $currPath = Join-Path $appDir $relPath
              if (-not (Test-Path $currPath)) { $stats.Deleted++ }
          }
          
          @"
          # FundOffice Delta Package
          ## Version: $currentTag
          ## Previous: $prevTag
          ## Generated: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ssZ')

          ### 📊 Statistics
          - 🔁 Changed files: $($stats.Changed)
          - ➕ Added files: $($stats.Added)
          - ➖ Deleted files: $($stats.Deleted)

          ### 📦 Usage
          1. 确保已安装 $prevTag 或相近版本
          2. 解压此 ZIP 到 FundOffice 安装目录
          3. 覆盖提示时选择"替换"
          4. 重启应用完成更新

          > ⚠️ 如果跨多个版本更新，建议使用完整包
          "@ | Out-File (Join-Path $deltaDir "DELTA_README.md") -Encoding UTF8
          
          if ($stats.Changed + $stats.Added -gt 0) {
              $deltaZip = "./FundOffice-Delta-$currentTag.zip"
              Compress-Archive -Path "$deltaDir/*" -DestinationPath $deltaZip -Force
              Write-Host "✅ 增量包创建成功: $deltaZip" -ForegroundColor Green
              Write-Host "   📈 变更:$($stats.Changed) | ➕新增:$($stats.Added) | ➖删除:$($stats.Deleted)" -ForegroundColor Cyan
              echo "HAS_DELTA=true" >> $env:GITHUB_ENV
              echo "DELTA_ZIP=$deltaZip" >> $env:GITHUB_ENV
          } else {
              Write-Host "ℹ️ 无文件变更，跳过增量包生成" -ForegroundColor Gray
              echo "HAS_DELTA=false" >> $env:GITHUB_ENV
          }

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FundOffice ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.TAG }}
          files: ./FundOffice-Win-x64.zip
          draft: false
          prerelease: ${{ steps.version.outputs.ISTAG != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 上传增量包到 Release
        if: env.HAS_DELTA == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          files: ${{ env.DELTA_ZIP }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
