name: 发布WPF

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: 初始化强签名密钥
        shell: pwsh
        run: |
          # 1. 获取 Secret 并清除所有空白/换行符（防止手动粘贴带入的格式问题）
          $b64 = "${{ secrets.FOSNK }}" -replace '\s', ''
          
          # 2. 原生 Base64 解码并写入临时文件
          $bytes = [Convert]::FromBase64String($b64)
          $keyPath = Join-Path $env:RUNNER_TEMP "fo.snk"
          [IO.File]::WriteAllBytes($keyPath, $bytes)
          
          # 3. 导出环境变量（⚠️ 必须与 Directory.Build.props 中的 $(ESIGN_KEY_PATH) 一致）
          Add-Content $env:GITHUB_ENV "STRONG_KEY_PATH=$keyPath"

      - name: 执行发布逻辑（容错版）
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = $PWD.Path
          Set-Location $scriptPath

           # 🔥 [新增] 批量转换编码：GB2312/GBK → UTF-8 with BOM
          # 🔥 [0/4] 修复编码：将 GB2312/GBK 的 .cs 文件转为 UTF-8 with BOM
          Write-Host "`n[0/4] 修复源文件编码 (GB2312 → UTF-8 BOM)..." -ForegroundColor Cyan
          try {
              $encGbk = [System.Text.Encoding]::GetEncoding(936)  # GB2312/GBK
          } catch {
              # Windows Runner 默认支持 936，如失败则尝试备用方案
              Write-Host "⚠️ 无法加载 GB2312 编码，尝试用 UTF-8 直接读取（可能已转换）" -ForegroundColor Yellow
              $encGbk = $null
          }
          $encUtf8Bom = [System.Text.UTF8Encoding]::new($true)
    
          $converted = 0
          $skipped = 0
    
          Get-ChildItem -Path $scriptPath -Include "*.cs" -Recurse -File | Where-Object {
              $_.FullName -notmatch '\\obj\\|\\bin\\|\\publish\\|\\packages\\'
          } | ForEach-Object {
              $file = $_.FullName
              try {
                  # 尝试用 GB2312 读取（如果文件确实是该编码）
                  if ($encGbk) {
                      $content = [System.IO.File]::ReadAllText($file, $encGbk)
                  } else {
                      # 降级方案：直接用 UTF-8 读（文件可能已是正确编码）
                      $content = [System.IO.File]::ReadAllText($file)
                  }
                  # 写回为 UTF-8 with BOM
                  [System.IO.File]::WriteAllText($file, $content, $encUtf8Bom)
                  $converted++
                  Write-Host "  ✓ $($_.Name)" -ForegroundColor DarkGray
              } catch {
                  # 如果读取失败，可能是已经是 UTF-8 或其他编码，跳过避免破坏
                  $skipped++
                  Write-Host "  ⊘ $($_.Name) (跳过)" -ForegroundColor Gray
              }
          }
          Write-Host "  ✅ 编码转换完成: $converted 个文件已转换, $skipped 个跳过" -ForegroundColor Green

          # 🔥 [编码修复结束，继续原有发布逻辑] 👇


          $publishDir = Join-Path $scriptPath "publish"
          $languageFolders = @("cs","de","es","fr","it","ja","ko","pl","pt-BR","ru","tr")
          $foldersToKeep = @("esign", "mission", "runtimes", "trigger", "trustee")

          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "开始发布 FundOffice 项目" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          # 准备发布目录
          if (Test-Path $publishDir) {
              Write-Host "清理发布目录..." -ForegroundColor Yellow
              Get-ChildItem -Path $publishDir -Force | ForEach-Object {
                  if ($foldersToKeep -notcontains $_.Name) {
                      Remove-Item $_.FullName -Recurse -Force
                  }
              }
          } else {
              New-Item -ItemType Directory -Path $publishDir -Force | Out-Null
          }

          # [1/4] NuGet Restore（必需）
          Write-Host "`n[1/4] 执行 NuGet Restore..." -ForegroundColor Cyan
          dotnet restore "FundOffice.slnx"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # [2/4] 发布主解决方案（失败则终止）
          Write-Host "[2/4] 发布主解决方案: FundOffice.slnx" -ForegroundColor Cyan
          $solutionFile = Join-Path $scriptPath "FundOffice.slnx"
          if (Test-Path $solutionFile) {
              dotnet publish $solutionFile -c Release -r win-x64 --self-contained false -o $publishDir /p:DebugSymbols=false /p:DebugType=None /p:UseAppHost=true
              if ($LASTEXITCODE -ne 0) {
                  Write-Host "[FAIL] 主解决方案发布失败，终止流程" -ForegroundColor Red
                  exit 1
              }
              Write-Host "[OK] 主解决方案发布成功" -ForegroundColor Green
          } else {
              Write-Host "[WARN] 未找到 $solutionFile，跳过主解决方案发布" -ForegroundColor Yellow
          }

          # [3/4] 发布 Tools 项目（失败则跳过，继续下一个）
          Write-Host "`n[3/4] 发布 src\Tools 下的工具项目（失败自动跳过）..." -ForegroundColor Cyan
          $toolsPath = Join-Path $scriptPath "src\Tools"
          $successCount = 0
          $skipCount = 0
          $failedProjects = @()

          if (Test-Path $toolsPath) {
              $projects = Get-ChildItem -Path $toolsPath -Include "*.csproj","*.vbproj" -Recurse -File |
                          Where-Object { $_.FullName -notmatch '\\obj\\' -and $_.Name -notmatch '_' }

              foreach ($proj in $projects) {
                  Write-Host "`n  → 尝试发布: $($proj.Name)" -ForegroundColor Yellow
                  # 使用 try-catch 捕获任何异常，确保单个项目失败不影响其他
                  try {
                      dotnet publish $proj.FullName `
                          -c Release `
                          -r win-x64 `
                          --self-contained false `
                          -o $publishDir `
                          /p:DebugSymbols=false `
                          /p:DebugType=None `
                          /p:UseAppHost=true `
                          --nologo

                      if ($LASTEXITCODE -eq 0) {
                          Write-Host "  [OK] $($proj.BaseName)" -ForegroundColor Green
                          $successCount++
                      } else {
                          Write-Host "  [SKIP] $($proj.BaseName) - 发布返回非零退出码" -ForegroundColor Yellow
                          $skipCount++
                          $failedProjects += $proj.Name
                      }
                  } catch {
                      Write-Host "  [SKIP] $($proj.BaseName) - $_" -ForegroundColor Yellow
                      $skipCount++
                      $failedProjects += $proj.Name
                  }
              }
          } else {
              Write-Host "[WARN] 未找到 src\Tools 目录" -ForegroundColor Yellow
          }

          # 统计 Tools 发布结果
          Write-Host "`n[Tools 发布统计]" -ForegroundColor Cyan
          Write-Host "  成功: $successCount | 跳过: $skipCount" -ForegroundColor White
          if ($failedProjects.Count -gt 0) {
              Write-Host "  跳过的项目:" -ForegroundColor Yellow
              $failedProjects | ForEach-Object { Write-Host "    - $_" -ForegroundColor Gray }
          }

          # [4/4] 清理语言文件夹、PDB 和未引用 DLL
          Write-Host "`n[4/4] 执行发布后清理..." -ForegroundColor Cyan
          foreach ($lang in $languageFolders) {
              $p = Join-Path $publishDir $lang
              if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }
          Get-ChildItem -Path $publishDir -Filter "*.pdb" -Recurse -File | Remove-Item -Force

          # ========================================
          # 安全清理未引用的项目 DLL（CI/CD 安全版）
          # ========================================
          
          # 🔧 修复原脚本 $publishDir 末尾空格导致的路径匹配失败
          $publishRoot = (Get-Item $publishDir).FullName.Trim()

          # 1. 收集所有子目录中的 DLL 文件名（忽略大小写）
          $subDllNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          Get-ChildItem -Path $publishRoot -Filter "*.dll" -File -Recurse |
              Where-Object { $_.Directory.FullName -ne $publishRoot } |
              ForEach-Object { $null = $subDllNames.Add($_.Name) }

          # 2. 遍历根目录 DLL，若子目录有同名则删除根目录版本
          $delCount = 0
          Get-ChildItem -Path $publishRoot -Filter "*.dll" -File |
              Where-Object { $subDllNames.Contains($_.Name) } |
              ForEach-Object {
                  $dll = $_
                  Write-Host "  [删除] 根目录重复 DLL: $($dll.FullName)" -ForegroundColor Yellow
                  Remove-Item $dll.FullName -Force -ErrorAction SilentlyContinue
                  $delCount++

                  # 同步清理根目录附属文件（.xml / .config）
                  @(".xml", ".config") | ForEach-Object {
                      $ext = $_
                      $path = Join-Path $publishRoot "$($dll.BaseName)$ext"
                      if (Test-Path $path) {
                          Remove-Item $path -Force -ErrorAction SilentlyContinue
                          Write-Host "    └─ 清理附属: $ext" -ForegroundColor DarkGray
                      }
                  }
              }

          if ($delCount -gt 0) {
              Write-Host "  ✓ 共清理 $delCount 个根目录重复 DLL（已保留子目录版本）" -ForegroundColor Green
          } else {
              Write-Host "  ✓ 无根目录重复 DLL，无需清理" -ForegroundColor Gray
          }
          Write-Host ""
        shell: pwsh


      - name: 签名指定文件夹 DLL（防篡改）
        if: ${{ success() }}
        shell: pwsh
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $publishDir = "./publish"
          $targetFolders = @("esign", "mission", "trigger", "trustee")

          if ([string]::IsNullOrWhiteSpace($env:CERT_PFX_BASE64)) {
              Write-Error "❌ 缺少签名证书 Secret (CERT_PFX_BASE64)，终止流程。"
              exit 1
          }

          Write-Host "🔐 正在加载签名证书..." -ForegroundColor Cyan
          
          # 1. 清理并解码 Base64
          $cleanBase64 = $env:CERT_PFX_BASE64 -replace '[\s"\'']', ''
          try { $certBytes = [System.Convert]::FromBase64String($cleanBase64) } catch {
              Write-Error "❌ Base64 解码失败。请检查 Secret 是否被截断。"; exit 1
          }

          # 2. 🔥 核心修复：强制加载私钥的终极标志组合（参考你提供的脚本）
          try {
              $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::Exportable -bor
                        [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::UserKeySet -bor
                        [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet -bor
                        [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::MachineKeySet

              $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($certBytes, $env:CERT_PASSWORD, $flags)
          } catch {
              Write-Error "❌ PFX 加载失败：$_"; exit 1
          }

          # 3. 🔑 提前校验：证书是否包含私钥（最关键！）
          if (-not $cert.HasPrivateKey) {
              Write-Error "❌ 致命错误：PFX 证书未加载出私钥！请检查密码或证书是否损坏。"; exit 1
          }
          Write-Host "✅ 证书加载成功，包含私钥" -ForegroundColor Green

           # 4. 🔥 核心修复：分级兼容提取私钥（支持 CAPI / CNG / 纯托管）
          try {
              $privateKey = $cert.PrivateKey

              # 方案 A: PrivateKey 本身就是 RSA 且可直接签名（最常见）
              if ($privateKey -is [System.Security.Cryptography.RSA]) {
                  $rsa = $privateKey
                  Write-Host "✅ 方案 A: 直接使用证书内置 RSA 私钥" -ForegroundColor Green
              }
              # 方案 B: 尝试从证书对象直接导出 PKCS#8（新式 .NET）
              elseif ($cert.GetType().GetMethod("ExportPkcs8PrivateKey")) {
                  $pkcs8Bytes = $cert.ExportPkcs8PrivateKey()
                  $rsa = [System.Security.Cryptography.RSA]::Create()
                  $null = $rsa.ImportPkcs8PrivateKey($pkcs8Bytes, [ref]$null)
                  Write-Host "✅ 方案 B: 通过 ExportPkcs8PrivateKey 提取私钥" -ForegroundColor Green
              }
              # 方案 C: 传统 CAPI 回退（兼容 RSACryptoServiceProvider）
              else {
                  $cspBlob = $privateKey.ExportCspBlob($true)  # $true = 包含私钥
                  $rsa = [System.Security.Cryptography.RSACryptoServiceProvider]::new()
                  $rsa.ImportCspBlob($cspBlob)
                  Write-Host "✅ 方案 C: 通过 ExportCspBlob 提取私钥（兼容旧版）" -ForegroundColor Green
              }
          } catch {
              Write-Error "⛔ 私钥提取失败：$_"; exit 1
          }

          # 5. 执行签名
          $signCount = 0
          foreach ($folder in $targetFolders) {
              $folderPath = Join-Path $publishDir $folder
              if (Test-Path $folderPath) {
                  Write-Host "📂 正在扫描并签名: $folderPath" -ForegroundColor Cyan
                  $dlls = Get-ChildItem -Path $folderPath -Filter "*.dll" -File -Recurse
                  foreach ($dll in $dlls) {
                      try {
                          $data = [System.IO.File]::ReadAllBytes($dll.FullName)
                          $sig = $rsa.SignData($data, [System.Security.Cryptography.HashAlgorithmName]::SHA256, [System.Security.Cryptography.RSASignaturePadding]::Pkcs1)
                          [System.IO.File]::WriteAllBytes("$($dll.FullName).ck", $sig)
                          $signCount++
                      } catch {
                          Write-Host "  ⚠️ 签名失败: $($dll.Name) - $_" -ForegroundColor Yellow
                      }
                  }
              } else {
                  Write-Host "⚠️ 文件夹不存在，跳过: $folderPath" -ForegroundColor Yellow
              }
          }
          Write-Host "`n✅ 签名完成！共处理 $signCount 个 DLL，已生成对应 .sig 文件。" -ForegroundColor Green



      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FundOffice-Win-x64
          path: ./publish/

      - name: 打包 ZIP
        run: Compress-Archive -Path ./publish/* -DestinationPath ./FundOffice-Win-x64.zip -Force
        shell: powershell

      - name: 打包 Trustee 文件夹 ZIP
        run: Compress-Archive -Path ./publish/trustee/* -DestinationPath ./FundOffice-Trustee-Win-x64.zip -Force
        shell: powershell


      - name: 确定版本号
        id: version
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
              $version = "${{ github.ref_name }}"; $tag = "${{ github.ref_name }}"; $isTag = "true"
          } else {
              $version = "dev-build-$(Get-Date -Format 'yyyyMMddHHmm')"; $tag = "dev"; $isTag = "false"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "ISTAG=$isTag" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FundOffice ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.TAG }}
          files: ./FundOffice-Win-x64.zip
          draft: false
          prerelease: ${{ steps.version.outputs.ISTAG != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}