name: 发布WPF

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: 执行发布逻辑（修复版）
        run: |
          $ErrorActionPreference = "Stop"
          $scriptPath = $PWD.Path
          Set-Location $scriptPath
          $publishDir = Join-Path $scriptPath "publish"
          $languageFolders = @("cs","de","es","fr","it","ja","ko","pl","pt-BR","ru","tr","zh-Hans","zh-Hant","playwright")
          $foldersToKeep = @("esign", "mission", "runtimes", "trigger", "trustee")

          Write-Host "========================================" -ForegroundColor Cyan
          Write-Host "开始发布 FundOffice 项目" -ForegroundColor Cyan
          Write-Host "========================================" -ForegroundColor Cyan

          # 准备发布目录
          if (Test-Path $publishDir) {
              Write-Host "清理发布目录..." -ForegroundColor Yellow
              Get-ChildItem -Path $publishDir -Force | ForEach-Object {
                  if ($foldersToKeep -notcontains $_.Name) {
                      Remove-Item $_.FullName -Recurse -Force
                  }
              }
          } else {
              New-Item -ItemType Directory -Path $publishDir -Force | Out-Null
          }

          # 【关键修复】先执行 restore，避免 assets.json 缺失
          Write-Host "`n[1/4] 执行 NuGet Restore..." -ForegroundColor Cyan
          dotnet restore "FundOffice.slnx"
          if ($LASTEXITCODE -ne 0) { exit 1 }

          # 【关键修复】遍历项目单独 publish，避免 solution --output 不支持的问题
          Write-Host "[2/4] 发布所有可执行项目..." -ForegroundColor Cyan
          $projects = Get-ChildItem -Recurse -Filter *.csproj | Where-Object {
              $_.FullName -notmatch '\\obj\\' -and $_.Name -notmatch '_'
          }

          foreach ($proj in $projects) {
              $content = Get-Content $proj.FullName -Raw
              if ($content -match '<OutputType>(WinExe|Exe)</OutputType>') {
                  Write-Host "  → 发布: $($proj.Name)" -ForegroundColor Yellow
                  dotnet publish $proj.FullName `
                      -c Release `
                      -r win-x64 `
                      --self-contained false `
                      -o $publishDir `
                      /p:DebugSymbols=false `
                      /p:DebugType=None `
                      /p:UseAppHost=true
                  if ($LASTEXITCODE -ne 0) {
                      Write-Host "[FAIL] $($proj.Name)" -ForegroundColor Red
                      exit 1
                  }
                  Write-Host "  [OK]" -ForegroundColor Green
              }
          }

          # 清理语言文件夹
          Write-Host "[3/4] 清理语言文件夹和 PDB..." -ForegroundColor Cyan
          foreach ($lang in $languageFolders) {
              $p = Join-Path $publishDir $lang
              if (Test-Path $p) { Remove-Item $p -Recurse -Force }
          }
          Get-ChildItem -Path $publishDir -Filter "*.pdb" -Recurse | Remove-Item -Force

          # 安全清理未引用的项目 DLL（同原脚本逻辑）
          Write-Host "[4/4] 清理未引用的项目 DLL..." -ForegroundColor Cyan
          $projectNames = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          Get-ChildItem -Path $scriptPath -Include "*.csproj","*.vbproj" -Recurse | ForEach-Object {
              $null = $projectNames.Add($_.BaseName)
          }

          $referencedDlls = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          Get-ChildItem -Path $publishDir -Filter "*.exe" -File | ForEach-Object {
              $deps = Join-Path $publishDir "$($_.BaseName).deps.json"
              if (Test-Path $deps) {
                  $json = Get-Content $deps -Raw | ConvertFrom-Json -ErrorAction SilentlyContinue
                  if ($json?.libraries) {
                      $json.libraries.PSObject.Properties.Name | ForEach-Object {
                          $null = $referencedDlls.Add(($_ -split '/')[0])
                      }
                  }
              }
          }

          Get-ChildItem -Path $publishDir -Filter "*.dll" -File |
              Where-Object { $projectNames.Contains($_.BaseName) -and -not $referencedDlls.Contains($_.BaseName) } |
              ForEach-Object {
                  Write-Host "  删除未引用: $($_.Name)" -ForegroundColor Yellow
                  Remove-Item $_.FullName -Force -ErrorAction SilentlyContinue
                  @(".xml",".config") | ForEach-Object {
                      $path = Join-Path $publishDir "$($_.BaseName)$_"
                      if (Test-Path $path) { Remove-Item $path -Force -ErrorAction SilentlyContinue }
                  }
              }

          Write-Host "`n[OK] 发布完成! 目录: $publishDir" -ForegroundColor Green
        shell: pwsh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: FundOffice-Win-x64
          path: ./publish/

      - name: 打包 ZIP
        run: Compress-Archive -Path ./publish/* -DestinationPath ./FundOffice-Win-x64.zip -Force
        shell: powershell

      - name: 确定版本号
        id: version
        run: |
          if ("${{ github.ref }}" -like "refs/tags/*") {
              $version = "${{ github.ref_name }}"; $tag = "${{ github.ref_name }}"; $isTag = "true"
          } else {
              $version = "dev-build-$(Get-Date -Format 'yyyyMMddHHmm')"; $tag = "dev"; $isTag = "false"
          }
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=$tag" >> $env:GITHUB_OUTPUT
          echo "ISTAG=$isTag" >> $env:GITHUB_OUTPUT
        shell: powershell

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FundOffice ${{ steps.version.outputs.VERSION }}
          tag_name: ${{ steps.version.outputs.TAG }}
          files: ./FundOffice-Win-x64.zip
          draft: false
          prerelease: ${{ steps.version.outputs.ISTAG != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}