name: 同步到 Gitee
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

jobs:
  sync-repo:
    runs-on: ubuntu-latest
    steps:
      - name: 同步仓库到 Gitee
        uses: Yikun/hub-mirror-action@master
        with:
          src: github/${{ github.repository_owner }}
          dst: gitee/iyu
          dst_key: ${{ secrets.GITEE_PRIVATE_KEY }}
          dst_token: ${{ secrets.GITEE_TOKEN }}
          static_list: ${{ github.event.repository.name }}
          mappings: FundOffice=>Gnoly
          force_update: true
          debug: true

  sync-releases:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 同步 Release 到 Gitee
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $ghOwner    = "${{ github.repository_owner }}"
          $ghRepo     = "${{ github.event.repository.name }}"
          $giteeOwner = "iyu"
          $giteeRepo  = "Gnoly"
          $apiBase    = "https://gitee.com/api/v5"

          $ghHeaders = @{
              Authorization = "token $env:GITHUB_TOKEN"
              Accept        = "application/vnd.github+json"
          }
          $giteeHeaders = @{
              Authorization = "token $env:GITEE_TOKEN"
          }

          # 获取所有 GitHub Releases（按创建时间升序，从旧到新同步）
          Write-Host "=== 获取 GitHub Releases ===" -ForegroundColor Cyan
          try {
              $releases = Invoke-RestMethod -Uri "https://api.github.com/repos/$ghOwner/$ghRepo/releases?per_page=100" -Headers $ghHeaders
          } catch {
              Write-Host "获取 GitHub Releases 失败: $_" -ForegroundColor Red
              exit 1
          }
          $releases = @($releases)
          if ($releases.Count -eq 0 -or $null -eq $releases[0]) {
              Write-Host "无 Release，跳过同步" -ForegroundColor Yellow
              exit 0
          }
          $releases = $releases | Sort-Object { [datetime]$_.created_at }
          Write-Host "找到 $($releases.Count) 个 Release（从旧到新排序）" -ForegroundColor Green

          $created = 0; $updated = 0; $skipped = 0

          foreach ($release in $releases) {
              $tagName = $release.tag_name
              Write-Host "`n--- [$tagName] $($release.name) ---" -ForegroundColor Cyan

              # 获取 GitHub 资产列表
              $ghAssets = @($release.assets)
              $hasAssets = $ghAssets.Count -gt 0 -and $null -ne $ghAssets[0]
              if ($hasAssets) {
                  Write-Host "  GitHub 资产: $(($ghAssets | ForEach-Object { $_.name }) -join ', ')" -ForegroundColor Gray
              } else {
                  Write-Host "  GitHub 无资产" -ForegroundColor Gray
              }

              # 检查 Gitee 是否已存在
              $existing = $null
              try {
                  $existing = Invoke-RestMethod -Uri "$apiBase/repos/$giteeOwner/$giteeRepo/releases/tags/$tagName" -Headers $giteeHeaders -ErrorAction SilentlyContinue
              } catch { }

              $needCreate = $false
              $existingId = $null

              if ($existing -and $existing.id) {
                  $existingId = $existing.id

                  # 获取 Gitee 资产名称列表
                  $giteeAssetNames = @()
                  try {
                      $giteeAssets = @(Invoke-RestMethod -Uri "$apiBase/repos/$giteeOwner/$giteeRepo/releases/$existingId/assets" -Headers $giteeHeaders)
                      $giteeAssetNames = @($giteeAssets | Where-Object { $_ -ne $null } | ForEach-Object { $_.name })
                  } catch { }

                  # 获取 GitHub 资产名称列表
                  $ghAssetNames = @()
                  if ($hasAssets) {
                      $ghAssetNames = @($ghAssets | ForEach-Object { $_.name })
                  }

                  # 对比资产名称
                  $assetsMatch = $false
                  if ($ghAssetNames.Count -eq $giteeAssetNames.Count) {
                      $diff = Compare-Object $ghAssetNames $giteeAssetNames
                      $assetsMatch = ($null -eq $diff -or $diff.Count -eq 0)
                  }

                  if ($assetsMatch) {
                      Write-Host "  资产一致，仅更新描述" -ForegroundColor Green
                      $updateBody = @{
                          tag_name   = $tagName
                          name       = $release.name
                          body       = if ($release.body) { $release.body } else { "Release $tagName" }
                          prerelease = [bool]$release.prerelease
                      } | ConvertTo-Json -Depth 3
                      try {
                          Invoke-RestMethod -Uri "$apiBase/repos/$giteeOwner/$giteeRepo/releases/$existingId" `
                              -Method Patch -Headers $giteeHeaders -Body $updateBody -ContentType "application/json" | Out-Null
                          Write-Host "  描述已更新" -ForegroundColor Green
                      } catch {
                          Write-Host "  描述更新失败: $_" -ForegroundColor Red
                      }
                      $skipped++
                      continue
                  } else {
                      Write-Host "  资产不一致，删除后重建..." -ForegroundColor Yellow
                      Write-Host "    GitHub: $($ghAssetNames -join ', ')" -ForegroundColor Gray
                      Write-Host "    Gitee:  $($giteeAssetNames -join ', ')" -ForegroundColor Gray
                      try {
                          Invoke-RestMethod -Uri "$apiBase/repos/$giteeOwner/$giteeRepo/releases/$existingId" -Method Delete -Headers $giteeHeaders | Out-Null
                          Write-Host "  已删除旧 Release" -ForegroundColor Green
                          $needCreate = $true
                      } catch {
                          Write-Host "  删除失败: $_" -ForegroundColor Red
                          $skipped++
                          continue
                      }
                  }
              } else {
                  $needCreate = $true
              }

              if (-not $needCreate) { continue }

              # 下载 GitHub 资产到临时目录
              $tempFiles = @()
              if ($hasAssets) {
                  foreach ($asset in $ghAssets) {
                      $tempFile = Join-Path $env:RUNNER_TEMP $asset.name
                      Write-Host "  下载: $($asset.name) ..." -ForegroundColor Gray
                      try {
                          Invoke-WebRequest -Uri $asset.url `
                              -Headers @{ Authorization = "token $env:GITHUB_TOKEN"; Accept = "application/octet-stream" } `
                              -OutFile $tempFile
                          $tempFiles += $tempFile
                          Write-Host "    下载成功" -ForegroundColor Green
                      } catch {
                          Write-Host "    下载失败: $_" -ForegroundColor Red
                      }
                  }
              }

              # 使用 curl 创建 Release 并附带资产（multipart form）
              $releaseBody = if ($release.body) { $release.body } else { "Release $tagName" }
              $commitish = if ($release.target_commitish) { $release.target_commitish } else { "main" }
              $isPrerelease = if ([bool]$release.prerelease) { "true" } else { "false" }

              $curlArgs = @(
                  "-s", "-w", "`n%{http_code}",
                  "-X", "POST",
                  "$apiBase/repos/$giteeOwner/$giteeRepo/releases",
                  "-F", "access_token=$env:GITEE_TOKEN",
                  "-F", "tag_name=$tagName",
                  "-F", "name=$($release.name)",
                  "-F", "body=$releaseBody",
                  "-F", "prerelease=$isPrerelease",
                  "-F", "target_commitish=$commitish"
              )

              for ($i = 0; $i -lt $tempFiles.Count; $i++) {
                  $curlArgs += @("-F", "assets[$i]=@$($tempFiles[$i])")
              }

              Write-Host "  创建 Release 并上传资产..." -ForegroundColor Cyan
              try {
                  $result = & curl @curlArgs
                  $lines = $result -split "`n"
                  $httpCode = $lines[-1]
                  $responseBody = ($lines[0..($lines.Count-2)]) -join "`n"

                  if ($httpCode -match '^2\d{2}$') {
                      if ($existingId) {
                          Write-Host "  Release 重建成功（含 $($tempFiles.Count) 个资产）" -ForegroundColor Green
                          $updated++
                      } else {
                          Write-Host "  Release 创建成功（含 $($tempFiles.Count) 个资产）" -ForegroundColor Green
                          $created++
                      }
                  } else {
                      Write-Host "  创建失败 (HTTP $httpCode): $responseBody" -ForegroundColor Red
                  }
              } catch {
                  Write-Host "  创建异常: $_" -ForegroundColor Red
              }

              # 清理临时文件
              foreach ($f in $tempFiles) {
                  Remove-Item $f -Force -ErrorAction SilentlyContinue
              }
          }

          Write-Host "`n=== 同步完成 ===" -ForegroundColor Cyan
          Write-Host "新建: $created | 重建: $updated | 跳过: $skipped" -ForegroundColor Green
